<div class="form-container">
    <form id="form">
        <h1> Place your order </h1>
        <div> <label for="name">Your Name</label>
            <input type="text" id="name" name="yourname" required>
        </div>
        <br>
        <div>
            <label for="email">Email: </label>
            <input type="email" id="email" name="email" required>
        </div>
        <br>

        <div><label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone-number" required>
        </div>
        <br>
<label for="comments">Comments:</label><br>
<textarea id="comments" name="comments" rows="5" required></textarea><br><br>

        <label for="flavor">Choose a flavor</label>
        <select name="flavor" id="flavor" required>

            <option value="">--Please choose an option--</option>
            <option value="sweetCream">Sweet Cream</option>
            <option value="saltedCaramel">Salted Caramel</option>
            <option value="mocha">Mocha</option>

        </select>

        <p>Please choose one:</p>
        <input type="radio" id="buy" name="buyOrWork" value="buy" required>
        <label for="buy">Purchase</label>

        <input type="radio" id="work" name="buyOrWork" value="work" required>
        <label for="work">Employment</label>


<br>

<button type="submit">Submit</button>
</form>
<p id="thank-you" class="hidden"></p>
