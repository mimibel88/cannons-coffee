<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafe Latte — Cannons Coffee</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

    <!-- Header (shared with homepage) -->
    <header class="site-header">
        <div class="container site-header__inner">
            <a href="index.html" class="logo">
                <img src="images/logo-nav.png" alt="Cannons Coffee" class="logo__img" />
                <span class="logo__text">CANNONS COFFEE</span>
            </a>
            <nav class="main-nav">
                <ul class="main-nav__list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="latte.html">Coffee</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>

    <!-- Product: Cafe Latte -->
    <section class="product">
        <div class="product__media">
            <img src="images/latte.jpg" alt="Barista pouring milk into a latte" />

        <div class="product__content">
            <h1>Cafe Latte</h1>
            <p>One shot of espresso coffee plus plenty of steamed milk. Choose skim milk, regular milk, or oat milk.</p>
            <a href="#order" class="btn btn--green">Order Now</a>
        </div>

    <!-- Footer (shared with homepage) -->
    <footer class="site-footer">
        <div class="container">
            <img src="images/logo-footer.png" alt="Cannons Coffee — Beans of Joy, Est. 2014" class="footer__logo" />

        </div>
